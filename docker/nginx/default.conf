server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types application/json application/vnd.mapbox-vector-tile;

    # Frontend (Vite build output, single-page app)
    location / {
        root /srv/frontend;
        try_files $uri /index.html =404;
    }

    # Vector tiles: serve from the disk cache written by PHP, otherwise let PHP render them.
    # /tiles/{z}/{x}/{y}.pbf -> /app/var/tiles/{z}/{x}/{y}.pbf
    location /tiles/ {
        root /app/var;
        default_type application/vnd.mapbox-vector-tile;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @php;
    }

    location /api/ {
        try_files /dev/null @php;
    }

    location @php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass php:9000;
    }
}
