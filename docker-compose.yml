services:
  db:
    # Multi-arch build of the official PostGIS image (postgis/postgis is amd64 only,
    # which would run emulated and slow on Apple Silicon).
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:-parcely}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  php:
    build: docker/php
    environment:
      APP_DEBUG: ${APP_DEBUG:-0}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-parcely}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/app:ro
      - ./frontend:/srv/frontend:ro
    depends_on:
      - php

volumes:
  db-data:
